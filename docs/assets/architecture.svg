<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">IP Intelligence architecture</title><desc id="desc">Authenticated portal to n8n, Supabase queue, three intelligence providers, saved report and analyst review.</desc><style>text{font-family:system-ui,sans-serif;fill:#e9e9e2;font-size:14px}.small{fill:#a2aaa9;font-size:11px}.packet{stroke-dasharray:6 22;animation:flow 3s linear infinite}@keyframes flow{to{stroke-dashoffset:-56}}@media(prefers-reduced-motion:reduce){.packet{animation:none}}</style><rect width="1000" height="240" rx="12" fill="#101214"/><g fill="none" stroke="#303638" stroke-width="2"><path d="M180 100H220M380 100H420M580 100H620M780 100H820"/></g><path class="packet" d="M180 100H220M380 100H420M580 100H620M780 100H820" fill="none" stroke="#e8b66a" stroke-width="3"/><g fill="#171a1d" stroke="#303638"><rect x="20" y="60" width="160" height="80" rx="7"/><rect x="220" y="60" width="160" height="80" rx="7"/><rect x="420" y="60" width="160" height="80" rx="7"/><rect x="620" y="60" width="160" height="80" rx="7"/><rect x="820" y="60" width="160" height="80" rx="7"/></g><g text-anchor="middle"><text x="100" y="94">Analyst portal</text><text class="small" x="100" y="116">Authenticated input</text><text x="300" y="94">n8n workflow</text><text class="small" x="300" y="116">Validate · orchestrate</text><text x="500" y="94">Supabase queue</text><text class="small" x="500" y="116">Budget · lease · fence</text><text x="700" y="94">Three providers</text><text class="small" x="700" y="116">Evidence + cache</text><text x="900" y="94">Report + review</text><text class="small" x="900" y="116">Saved assessment</text><text class="small" x="500" y="193">ASYNCHRONOUS ENRICHMENT · EXPLAINED HUMAN DECISIONS · NO AUTOMATIC BLOCKING</text></g></svg>
